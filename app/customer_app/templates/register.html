{% extends "base.html" %}

{% block title %}Register - Smriti Car Rental{% end block %}

{% block content %}
<div class="form-container" style="max-width: 600px;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Create an Account</h2>
    
    <form method="POST" action="{{ url_for('customer.register') }}">
        <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" name="name" class="form-control" required autofocus>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="phone_no">Phone Number *</label>
                <input type="tel" id="phone_no" name="phone_no" class="form-control" required>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="license_id_no">Driver's License ID *</label>
            <input type="text" id="license_id_no" name="license_id_no" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="address">Home Address</label>
            <input type="text" id="address" name="address" class="form-control">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
    </form>
    
    <p style="text-align: center; margin-top: 2rem; color: var(--gray);">
        Already have an account? <a href="{{ url_for('customer.login') }}">Log in here</a>
    </p>
</div>
{% end block %}
