{% extends "base.html" %}

{% block title %}Create Account — Smriti Rentals{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center; padding:4rem 0;">
    <div class="form-container" style="width:100%; max-width:600px;">
        <h2 class="form-title">Create an Account</h2>
        
        <form method="POST" action="{{ url_for('customer.register') }}">
            <div class="form-group">
                <label class="form-label" for="name">Full Name <span style="color:var(--primary);">*</span></label>
                <input type="text" id="name" name="name" class="form-control" required autofocus>
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address <span style="color:var(--primary);">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone_no">Phone Number <span style="color:var(--primary);">*</span></label>
                    <input type="tel" id="phone_no" name="phone_no" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="license_id_no">Driver's License ID <span style="color:var(--primary);">*</span></label>
                <input type="text" id="license_id_no" name="license_id_no" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="address">Home Address</label>
                <input type="text" id="address" name="address" class="form-control">
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
                <div class="form-group">
                    <label class="form-label" for="password">Password <span style="color:var(--primary);">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password <span style="color:var(--primary);">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem; padding:1.1rem; font-size:1.1rem;">
                Register
            </button>
        </form>
        
        <div style="margin-top:2rem; text-align:center; padding-top:2rem; border-top:1px solid var(--border-light);">
            <p style="font-weight:600; color:var(--text-muted); margin-bottom:1rem;">Already have an account?</p>
            <a href="{{ url_for('customer.login') }}" class="btn btn-outline" style="width:100%;">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
