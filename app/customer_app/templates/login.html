{% extends "base.html" %}

{% block title %}Login — Smriti Car Rental{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="form-container">
        <div style="text-align:center; margin-bottom:1.5rem;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle">Sign in to your Smriti Cars account</p>

        <form method="POST" action="{{ url_for('customer.login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="your@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem; padding:1rem; font-size:1.05rem;">
                Sign In
            </button>
        </form>

        <p style="text-align:center; margin-top:2rem; color:var(--text-muted); font-size:0.9rem;">
            Don't have an account?
            <a href="{{ url_for('customer.register') }}" style="color:var(--primary); font-weight:600;">Create one free</a>
        </p>
    </div>
</div>
{% endblock %}
