{% extends "base.html" %}

{% block title %}Sign in — Smriti Rentals{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center; padding: 4rem 0;">
    <div class="form-container" style="width: 100%; max-width: 480px;">
        <h2 class="form-title">Sign in</h2>
        
        <form method="POST" action="{{ url_for('customer.login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input type="email" id="email" name="email" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem; font-size:1.1rem; margin-top:1rem;">Sign in</button>
        </form>

        <div style="margin-top:2rem; text-align:center; padding-top:2rem; border-top:1px solid var(--border-light);">
            <p style="font-weight:600; color:var(--text-muted); margin-bottom:1rem;">Don't have an account?</p>
            <a href="{{ url_for('customer.register') }}" class="btn btn-outline" style="width:100%;">Register now</a>
        </div>
    </div>
</div>
{% endblock %}
